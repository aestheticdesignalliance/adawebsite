name: Prime Build Portfolio Image Optimization

on:
  push:
    branches:
      - primebuild-seo-services-gallery-2026
    paths:
      - 'scripts/optimize_images.py'
      - '.github/workflows/primebuild-optimize-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image encoder
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Create optimized WebP assets and update site references
        run: python scripts/optimize_images.py

      - name: Commit optimized assets to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/portfolio/residential/*.webp assets/image-optimization-report.json
          git add -- '*.html' 'js/prime.js' 'css/*.css'
          if ! git diff --cached --quiet; then
            git commit -m "Optimize Prime Build portfolio imagery and use modern WebP assets"
            git push origin HEAD:primebuild-seo-services-gallery-2026
          else
            echo 'No image changes to commit'
          fi
